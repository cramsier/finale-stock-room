<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BB Stock Room</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stock Room">
<meta name="theme-color" content="#141A21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D7DDE3; --line-soft:#E6EAEE;
  --ink:#141A21; --ink-2:#4A5560; --ink-3:#7B8794;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --good:#2E7D4F; --good-soft:#DFF2E6; --warn:#B5730A; --warn-soft:#FBEBCF; --crit:#B3261E; --crit-soft:#F8DEDC;
  --tab-bg:rgba(255,255,255,.92); --shadow:0 -1px 0 var(--line);
  --bar-track:#E1E6EB;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --surface:#171E25; --surface-2:#1E262E; --line:#2C363F; --line-soft:#232C34;
    --ink:#E6EBF0; --ink-2:#AAB6C1; --ink-3:#7A8791;
    --accent:#4FB3C4; --accent-ink:#0F1418; --accent-soft:#173A41;
    --good:#5CC48A; --good-soft:#173826; --warn:#E8A93A; --warn-soft:#3B2C0F; --crit:#F0655C; --crit-soft:#3F1B18;
    --tab-bg:rgba(23,30,37,.94); --bar-track:#2A343D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#171E25; --surface-2:#1E262E; --line:#2C363F; --line-soft:#232C34;
  --ink:#E6EBF0; --ink-2:#AAB6C1; --ink-3:#7A8791;
  --accent:#4FB3C4; --accent-ink:#0F1418; --accent-soft:#173A41;
  --good:#5CC48A; --good-soft:#173826; --warn:#E8A93A; --warn-soft:#3B2C0F; --crit:#F0655C; --crit-soft:#3F1B18;
  --tab-bg:rgba(23,30,37,.94); --bar-track:#2A343D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}

/* ---- shell ---- */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--tab-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header.top .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
header.top .stamp{font-size:12px;color:var(--ink-3);white-space:nowrap}
header.top .stamp b{color:var(--ink-2);font-weight:500}
main{flex:1;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
section.screen{display:none}
section.screen.active{display:block}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 1px 4px;border-radius:10px;color:var(--ink-3);font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent)}
nav.tabs button .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit);color:#fff;font-size:10.5px;line-height:16px;font-family:"Barlow",sans-serif;font-weight:600}

/* ---- shared pieces ---- */
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 4px 8px}
.eyebrow:first-child{margin-top:4px}
.eyebrow .cnt{color:var(--ink-2);margin-left:6px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line-soft)}
.list>li:first-child{border-top:0}
.rowbtn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:11px 14px;min-height:56px}
.rowbtn .t{font-weight:500;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.rowbtn .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.rowbtn .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rowbtn .big{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;line-height:1}
.rowbtn .big small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px;font-family:"Barlow",sans-serif}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.detail{display:none;padding:0 14px 14px;background:var(--surface-2);border-top:1px dashed var(--line)}
li.open .detail{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-top:10px;font-size:13.5px}
.kv .k{color:var(--ink-2)}
.kv .v{text-align:right;font-weight:500}
.kv .h{grid-column:1/-1;font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.kv .note{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.bar{height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-bottom:8px}
.search svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;padding:11px 0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search button{color:var(--ink-3);padding:6px;font-size:13px}
select.sel{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:8px}
.more{width:100%;padding:12px;text-align:center;color:var(--accent);font-weight:600;font-size:14px;border-top:1px solid var(--line-soft)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 4px 8px;flex-wrap:wrap}
.toolbar .eyebrow{margin:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.btn.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* ---- home ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:88px}
.tile .l{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;line-height:1.05;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile .d .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.tile .d .dot.crit{background:var(--crit)} .tile .d .dot.warn{background:var(--warn)} .tile .d .dot.good{background:var(--good)}
.note{font-size:13px;color:var(--ink-3);padding:6px 4px 0;line-height:1.4}
.stripe{border-left:3px solid transparent}
.stripe.crit{border-left-color:var(--crit)} .stripe.warn{border-left-color:var(--warn)}
.lotgrid{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13.5px;padding-top:8px}
.lotgrid .hd{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lotgrid .q{text-align:right;font-weight:500}
@media (prefers-reduced-motion:no-preference){ .detail{animation:fade .12s ease-out} }
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="row">
      <h1 id="title">Stock Room</h1>
      <div class="stamp">Finale · <b id="stamp">—</b></div>
    </div>
  </header>
  <main>
    <section class="screen active" id="s-home"></section>
    <section class="screen" id="s-stock"></section>
    <section class="screen" id="s-buy"></section>
    <section class="screen" id="s-inbound"></section>
    <section class="screen" id="s-orders"></section>
    <section class="screen" id="s-lots"></section>
    <section class="screen" id="s-fba"></section>
  </main>
  <nav class="tabs" aria-label="Screens"><div class="in">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Stock<span class="badge" id="b-stock" hidden></span></button>
    <button data-tab="buy"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.3"/><circle cx="18" cy="21" r="1.3"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>Buy<span class="badge" id="b-buy" hidden></span></button>
    <button data-tab="inbound"><svg viewBox="0 0 24 24"><path d="M1 8h14v9H1z"/><path d="M15 11h4l4 3v3h-8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Inbound<span class="badge" id="b-inbound" hidden></span></button>
    <button data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Orders<span class="badge" id="b-orders" hidden></span></button>
    <button data-tab="lots"><svg viewBox="0 0 24 24"><path d="M3 5h3v14H3zM8 5h2v14H8zM12 5h4v14h-4zM18 5h3v14h-3z"/></svg>Lots</button>
    <button data-tab="fba"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>FBA<span class="badge" id="b-fba" hidden></span></button>
  </div></nav>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '—' : Number(n).toLocaleString('en-US', {maximumFractionDigits: 0});
const fdate = s => { if (!s) return '—'; const [y,m,d] = s.split('-'); return `${+m}/${+d}`; };
const fdateY = s => { if (!s) return '—'; const [y,m,d] = s.split('-'); return `${+m}/${+d}/${y.slice(2)}`; };
const today = D.meta.today;
const daysFrom = s => s ? Math.round((new Date(today) - new Date(s)) / 86400000) : null;

// ---- CSV export (client-side only; nothing leaves the device) ----
function toCSVCell(v){
  const s = v == null ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV(filename, rows, cols){
  const head = cols.map(c => toCSVCell(c[0])).join(',');
  const body = rows.map(r => cols.map(c => toCSVCell(c[1](r))).join(',')).join('\n');
  const blob = new Blob([head + '\n' + body], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportBtn(id, label){ return `<button class="btn acc" id="${id}"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>${esc(label)}</button>`;
}

// ---- sorting ----
// Compares IDs/order numbers numerically when both sides look numeric, else falls back to text.
function idCompare(a, b){
  // Compare by the first run of digits (e.g. "BB-270608" -> 270608, "2606110801 - Biltong pt 2"
  // -> 2606110801) rather than stripping all digits, which would pull in unrelated numbers from
  // free-text suffixes some Finale PO ids carry (like the trailing "2" in "...Biltong pt 2").
  const sa = String(a ?? ''), sb = String(b ?? '');
  const ma = sa.match(/\d+/), mb = sb.match(/\d+/);
  if (ma && mb) { const na = Number(ma[0]), nb = Number(mb[0]); if (na !== nb) return na - nb; }
  return sa.localeCompare(sb);
}
function sortSelectHTML(id, options, current){
  return `<select class="sel" id="${id}">${options.map(([k,label]) => `<option value="${k}" ${current===k?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
}

// ---- stamp: relative time of last pull ----
(function stamp(){
  const t = new Date(D.meta.pulledAt);
  const mins = Math.round((Date.now() - t) / 60000);
  let rel = mins < 2 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins/60)} h ago` : `${Math.round(mins/1440)} d ago`;
  const abs = t.toLocaleString('en-US', {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'});
  $('#stamp').textContent = rel; $('#stamp').title = 'Pulled ' + abs;
})();

// ---- derived ----
const P = D.products;
const cases = p => (p.perCase && p.perCase > 1) ? Math.floor(p.onHand / p.perCase) : null;
const coverClass = p => {
  if (p.vel <= 0) return '';
  if (p.onHand <= 0 || p.cover === 0) return 'crit';
  if (p.cover != null && p.cover <= 14) return 'crit';
  if (p.cover != null && p.cover <= 30) return 'warn';
  return 'good';
};
const coverText = p => {
  if (p.vel <= 0) return p.onHand > 0 ? 'no sales 90d' : '—';
  if (p.onHand <= 0) return 'OUT';
  if (p.cover == null) return '—';
  if (p.cover >= 999) return '365+ d';
  return `${p.cover} d`;
};
const isLow = p => p.vel > 0 && (p.onHand <= 0 || (p.cover != null && p.cover <= 30));
const isOut = p => p.vel > 0 && p.onHand <= 0;
const lowList = P.filter(isLow).sort((a,b) => (a.onHand<=0?-1:a.cover) - (b.onHand<=0?-1:b.cover) || b.vel - a.vel);
const outList = P.filter(isOut);
const inStock = P.filter(p => p.onHand > 0);
const locNames = [...new Set(P.flatMap(p => Object.keys(p.byLoc)))].sort((a,b) => P.filter(p=>p.byLoc[a]).length < P.filter(p=>p.byLoc[b]).length ? 1 : -1);
const cats = [...new Set(P.map(p => p.cat))].sort();

const S = D.sales.filter(o => !o.fba);
const FBA = D.sales.filter(o => o.fba);
const backorders = S.filter(o => o.eligible === 'Backordered');
const ready = S.filter(o => o.eligible === 'Eligible');
const packed = S.filter(o => /packed|shipped/i.test(o.eligible || '') || /Fully packed/.test(o.shipStatus||''));
const dueSoon = S.filter(o => o.ship && daysFrom(o.ship) >= -7);

const POs = D.pos.slice().sort((a,b) => (a.eta||'9999') < (b.eta||'9999') ? -1 : 1);
const latePOs = POs.filter(p => p.late > 0);
const doneOpenPOs = POs.filter(p => p.fullyReceived);
const T = D.transfers;
const tInbound = T.filter(t => t.dest === 'BBHQ' && !/received/i.test(t.shipStatus||''));
const tStale = T.filter(t => /received/i.test(t.shipStatus||''));
const tMoving = T.filter(t => !/received/i.test(t.shipStatus||'') && t.dest !== 'BBHQ');
const lotted = P.filter(p => p.lots.length);

// ---- Amazon FBA derived ----
// Finale tracks Amazon as its own set of locations per SKU (Fulfillable, FC Processing/Transfer,
// Inbound Receiving/Shipped, AWD Outbound, Unfulfillable, Researching). Bucket those into
// sellable-now / in-the-pipeline / stuck, per product.
function fbaBuckets(p){
  let full = 0, inb = 0, stuck = 0;
  for (const [loc, qty] of Object.entries(p.byLoc)){
    if (!loc.includes('Amazon')) continue;
    if (loc.includes('Unfulfillable') || loc.includes('Researching') || loc.includes('Problem')) stuck += qty;
    else if (loc.includes('Fulfillable')) full += qty;
    else inb += qty;
  }
  return { full, inb, stuck };
}
const fbaCover = p => p.vel > 0 ? Math.round(p.fbaB.full / p.vel) : null;
const fbaCoverClass = p => {
  if (p.vel <= 0) return '';
  if (p.fbaB.full <= 0) return p.fbaB.inb > 0 ? 'warn' : 'crit';
  const c = fbaCover(p);
  if (c <= 14) return 'crit';
  if (c <= 30) return 'warn';
  return 'good';
};
// Suggested units to ship to Amazon: enough to reach a target days-of-cover at Amazon, net of
// what's already fulfillable/inbound there, capped by what's actually on hand elsewhere to send.
const FBA_TARGET_DAYS = 45;
function fbaShipInfo(p){
  const warehouse = Math.max(0, p.onHand - p.fbaB.full - p.fbaB.inb - p.fbaB.stuck);
  const target = p.vel > 0 ? Math.round(p.vel * FBA_TARGET_DAYS) : 0;
  const need = Math.max(0, target - p.fbaB.full - p.fbaB.inb);
  const ship = Math.min(need, warehouse);
  return { warehouse, target, need, ship, cover: fbaCover(p) };
}
const fbaAll = P.filter(p => Object.keys(p.byLoc).some(l => l.includes('Amazon'))).map(p => {
  const withB = Object.assign({}, p, { fbaB: fbaBuckets(p) });
  return Object.assign(withB, { fba: fbaShipInfo(withB) });
});
const fbaAtRisk = fbaAll.filter(p => p.vel > 0 && (p.fbaB.full <= 0 || fbaCover(p) <= 30)).sort((a,b) => {
  const av = a.fbaB.full <= 0 ? -1 : fbaCover(a), bv = b.fbaB.full <= 0 ? -1 : fbaCover(b);
  return av - bv || b.vel - a.vel;
});
const fbaUrgent = fbaAll.filter(p => p.vel > 0 && p.fbaB.full <= 0 && p.fbaB.inb <= 0);
const fbaStuckList = fbaAll.filter(p => p.fbaB.stuck > 0).sort((a,b) => b.fbaB.stuck - a.fbaB.stuck);
const fbaTotals = fbaAll.reduce((a,p) => ({ full: a.full+p.fbaB.full, inb: a.inb+p.fbaB.inb, stuck: a.stuck+p.fbaB.stuck, ship: a.ship+p.fba.ship }), {full:0, inb:0, stuck:0, ship:0});

// ---- Buy / reorder suggestions ----
// pipeline = what's already on hand or inbound, net of what's already promised to open sales orders.
// target = enough units to survive lead time + a 14-day safety buffer at current velocity (or the
// reorder point Finale already has configured, for slow movers with no reliable velocity).
const BUY_BUFFER_DAYS = 14;
function buyInfo(p){
  const pipeline = p.onHand + p.onOrder - p.reserved;
  const lead = p.lead || 30;
  const target = p.vel > 0 ? Math.ceil(p.vel * (lead + BUY_BUFFER_DAYS)) : (p.reorderPt || 0);
  const suggested = Math.max(0, target - pipeline);
  const coverDays = p.vel > 0 ? Math.round(pipeline / p.vel) : null;
  const urgent = p.onHand <= 0 || (coverDays != null && coverDays <= lead);
  return { pipeline, lead, target, suggested, coverDays, urgent };
}
const buyList = P.filter(p => p.vel > 0 || (p.reorderPt != null && p.onHand <= p.reorderPt))
  .map(p => Object.assign({}, p, { buy: buyInfo(p) }))
  .filter(p => p.buy.suggested > 0)
  .sort((a,b) => (a.buy.urgent === b.buy.urgent ? 0 : a.buy.urgent ? -1 : 1) || (a.buy.coverDays ?? -1) - (b.buy.coverDays ?? -1) || b.buy.suggested - a.buy.suggested);
const buyUrgent = buyList.filter(p => p.buy.urgent);
const buySuppliers = (() => {
  const m = new Map();
  buyList.forEach(p => {
    const key = p.supplier || 'No supplier on file';
    if (!m.has(key)) m.set(key, { name: key, items: [], units: 0, urgent: 0 });
    const s = m.get(key); s.items.push(p); s.units += p.buy.suggested; if (p.buy.urgent) s.urgent++;
  });
  const openBySupplier = new Map();
  POs.forEach(po => { const k = po.supplier || 'No supplier on file'; if (!openBySupplier.has(k)) openBySupplier.set(k, []); openBySupplier.get(k).push(po); });
  return [...m.values()].map(s => {
    const open = openBySupplier.get(s.name) || [];
    return Object.assign(s, { openPOs: open.length, latePOs: open.filter(p=>p.late>0).length, nextEta: open.map(p=>p.eta).filter(Boolean).sort()[0] || null });
  }).sort((a,b) => b.urgent - a.urgent || b.units - a.units);
})();

function listWithMore(items, renderFn, pageSize=40, ctx){
  const id = 'l' + Math.random().toString(36).slice(2,8);
  let shown = Math.min(pageSize, items.length);
  const html = `<div class="panel"><ul class="list" id="${id}">${items.slice(0, shown).map(x => renderFn(x, ctx)).join('')}</ul>${items.length > shown ? `<button class="more" data-for="${id}">Show ${Math.min(pageSize, items.length - shown)} more of ${items.length}</button>` : ''}${items.length ? '' : '<div class="empty">Nothing here right now</div>'}</div>`;
  setTimeout(() => {
    const ul = document.getElementById(id); if (!ul) return;
    bindRows(ul);
    const more = ul.parentElement.querySelector('.more');
    if (more) more.addEventListener('click', () => {
      const next = items.slice(shown, shown + pageSize); shown += next.length;
      const frag = document.createElement('div'); frag.innerHTML = next.map(x => renderFn(x, ctx)).join('');
      [...frag.children].forEach(li => ul.appendChild(li)); bindRows(ul);
      if (shown >= items.length) more.remove(); else more.textContent = `Show ${Math.min(pageSize, items.length - shown)} more of ${items.length}`;
    });
  }, 0);
  return html;
}

function drawStock(){
  const el = $('#s-stock');
  el.querySelectorAll('#stockChips .chip').forEach(c => c.classList.toggle('active', c.dataset.chip === stockState.chip));
  let items;
  switch (stockState.chip){
    case 'low': items = lowList; break;
    case 'out': items = outList.slice().sort((a,b)=>b.vel-a.vel); break;
    case 'inbound': items = P.filter(p=>p.onOrder>0).sort((a,b)=>b.onOrder-a.onOrder); break;
    case 'reserved': items = P.filter(p=>p.reserved>0).sort((a,b)=>b.reserved-a.reserved); break;
    case 'every': items = P.slice().sort((a,b)=>(a.desc||'').localeCompare(b.desc||'')); break;
    default: items = inStock.slice().sort((a,b)=>(a.desc||'').localeCompare(b.desc||''));
  }
  if (stockState.loc) items = items.filter(p => p.byLoc[stockState.loc] > 0).map(p => Object.assign({}, p, {onHand: p.byLoc[stockState.loc]}));
  if (stockState.cat) items = items.filter(p => p.cat === stockState.cat);
  const q = stockState.q.trim().toLowerCase();
  if (q){
    const terms = q.split(/\s+/);
    items = (stockState.chip === 'all' && !stockState.loc ? P : items).filter(p => { const hay = `${p.id} ${p.desc||''} ${p.upc||''} ${p.cat}`.toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  const sortFn = STOCK_SORTS[stockState.sort][1];
  if (sortFn) items = items.slice().sort(sortFn);
  const head = `<div class="toolbar"><div class="eyebrow">${stockState.loc ? esc(stockState.loc) + ' · ' : ''}${q ? 'Search results' : ({all:'In stock',low:'Low cover — sells, ≤30 days left',out:'Out of stock — still selling',inbound:'On order',reserved:'Reserved on open orders',every:'All active SKUs'})[stockState.chip]}<span class="cnt num">${items.length}</span></div>${exportBtn('stockExport', 'Export CSV')}</div>`;
  $('#stockList', el).innerHTML = head + listWithMore(items, productRow, 40, stockState.loc ? 'loc' : '');
  const xb = document.getElementById('stockExport');
  if (xb) xb.addEventListener('click', () => exportCSV('stock.csv', items, [
    ['SKU', p=>p.id], ['Description', p=>p.desc], ['Category', p=>p.cat], ['Supplier', p=>p.supplier],
    ['On hand', p=>p.onHand], ['Cover', p=>coverText(p)], ['On order', p=>p.onOrder], ['Reserved', p=>p.reserved],
    ['Sold 30d', p=>p.s30], ['Sold 90d', p=>p.s90], ['Velocity/day', p=>p.vel], ['UPC', p=>p.upc],
  ]));
}

function drawInbound(){

    <div class="tile"><span class="l">Suggested to ship</span><span class="v num">${fmt(fbaTotals.ship)}</span><span class="d"><span class="dot ${fbaUrgent.length?'crit':'good'}"></span>${fbaUrgent.length} urgent · ${fmt(fbaTotals.inb)} already inbound</span></div>
  </div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="fq" type="search" placeholder="SKU or description" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(fbaState.q)}"><button id="fqx" ${fbaState.q?'':'hidden'}>Clear</button></div>
  <div class="chips" id="fbaChips">
    <button class="chip" data-chip="risk">Needs restock<span class="n">${fbaAtRisk.length}</span></button>
    <button class="chip" data-chip="urgent">Urgent<span class="n">${fbaUrgent.length}</span></button>
    <button class="chip" data-chip="stuck">Stuck<span class="n">${fbaStuckList.length}</span></button>
    <button class="chip" data-chip="all">All on Amazon<span class="n">${fbaAll.length}</span></button>
  </div>
  ${sortSelectHTML('fsort', Object.entries(FBA_SORTS).map(([k,v])=>[k,v[0]]), fbaState.sort)}
  <div id="fbaList"></div>
  <p class="note">Fulfillable = sellable right now at Amazon; cover uses the same blended, all-channel sales velocity as the rest of this dashboard (Finale doesn't split velocity by channel), so treat it as a first pass, not an exact Amazon-only rate. The ship suggestion targets ~${FBA_TARGET_DAYS} days of Amazon cover and is capped by what's actually on hand outside Amazon — it doesn't know Amazon's restock limits or storage fees.</p>`;
  const q = $('#fq', el), qx = $('#fqx', el);
  q.addEventListener('input', () => { fbaState.q = q.value; qx.hidden = !q.value; drawFBA(); });
  qx.addEventListener('click', () => { q.value=''; fbaState.q=''; qx.hidden=true; drawFBA(); q.focus(); });
  el.querySelectorAll('#fbaChips .chip').forEach(c => c.addEventListener('click', () => { fbaState.chip = c.dataset.chip; drawFBA(); }));
  $('#fsort', el).addEventListener('change', e => { fbaState.sort = e.target.value; drawFBA(); });
  drawFBA();
}
function drawFBA(){
  const el = $('#s-fba');
  el.querySelectorAll('#fbaChips .chip').forEach(c => c.classList.toggle('active', c.dataset.chip === fbaState.chip));
  const view = fbaState.chip === 'stuck' ? 'stuck' : 'risk';
  let items = { risk: fbaAtRisk, urgent: fbaUrgent, stuck: fbaStuckList, all: fbaAll }[fbaState.chip] || fbaAtRisk;
  const q = fbaState.q.trim().toLowerCase();
  if (q){ const terms = q.split(/\s+/); items = items.filter(p => { const hay = `${p.id} ${p.desc||''}`.toLowerCase(); return terms.every(t => hay.includes(t)); }); }
  const sortFn = FBA_SORTS[fbaState.sort][1];
  if (sortFn) items = items.slice().sort(sortFn);
  const label = {risk:'Needs restock at Amazon', urgent:'Urgent — out at Amazon, nothing inbound', stuck:'Stuck inventory', all:'All SKUs on Amazon'}[fbaState.chip];
  const head = `<div class="toolbar"><div class="eyebrow">${label}<span class="cnt num">${items.length}</span></div>${exportBtn('fbaExport', 'Export CSV')}</div>`;
  $('#fbaList', el).innerHTML = head + listWithMore(items, p => fbaRow(p, view), 40) +
    (fbaState.chip === 'stuck' ? `<p class="note">Sitting in Unfulfillable / Researching / Problem at Amazon — tied up and not sellable until it's worked in Seller Central.</p>` : '');
  const xb = document.getElementById('fbaExport');
  if (xb) xb.addEventListener('click', () => exportCSV('amazon-fba.csv', items, [
    ['SKU', p=>p.id], ['Description', p=>p.desc], ['Supplier', p=>p.supplier], ['Fulfillable', p=>p.fbaB.full],
    ['Inbound to Amazon', p=>p.fbaB.inb], ['Stuck', p=>p.fbaB.stuck], ['Available elsewhere', p=>p.fba.warehouse],
    ['Velocity/day', p=>p.vel], ['Amazon cover (d)', p=>p.fba.cover], ['Suggested to ship', p=>p.fba.ship],
  ]));
}

// ---- nav ----
const rendered = {};
const renderers = { home: renderHome, stock: renderStock, buy: renderBuy, inbound: renderInbound, orders: renderOrders, lots: renderLots, fba: renderFBA };
function go(tab, chip){
  document.querySelectorAll('section.screen').forEach(s => s.classList.toggle('active', s.id === 's-' + tab));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (chip && tab === 'stock') stockState.chip = chip;
  if (chip && tab === 'orders') orderState.chip = chip;
  if (chip && tab === 'buy') buyState.chip = chip;
  if (chip && tab === 'fba') fbaState.chip = chip;
  if (!rendered[tab]) { renderers[tab](); rendered[tab] = true; }
  else if (chip && tab === 'stock') drawStock();
  else if (chip && tab === 'orders') drawOrders();
  else if (chip && tab === 'buy') drawBuy();
  else if (chip && tab === 'fba') drawFBA();
  window.scrollTo(0, 0);
  try { localStorage.setItem('bb-tab', tab); } catch(e){}
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
let start = 'home';
try { const s = localStorage.getItem('bb-tab'); if (s && renderers[s]) start = s; } catch(e){}
go(start);
})();
</script>
</body>
</html>
