<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D7DDE3; --line-soft:#E6EAEE;
  --ink:#141A21; --ink-2:#4A5560; --ink-3:#7B8794;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --good:#2E7D4F; --good-soft:#DFF2E6; --warn:#B5730A; --warn-soft:#FBEBCF; --crit:#B3261E; --crit-soft:#F8DEDC;
  --tab-bg:rgba(255,255,255,.92); --shadow:0 -1px 0 var(--line);
  --bar-track:#E1E6EB;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1418; --surface:#171E25; --surface-2:#1E262E; --line:#2C363F; --line-soft:#232C34;
    --ink:#E6EBF0; --ink-2:#AAB6C1; --ink-3:#7A8791;
    --accent:#4FB3C4; --accent-ink:#0F1418; --accent-soft:#173A41;
    --good:#5CC48A; --good-soft:#173826; --warn:#E8A93A; --warn-soft:#3B2C0F; --crit:#F0655C; --crit-soft:#3F1B18;
    --tab-bg:rgba(23,30,37,.94); --bar-track:#2A343D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#171E25; --surface-2:#1E262E; --line:#2C363F; --line-soft:#232C34;
  --ink:#E6EBF0; --ink-2:#AAB6C1; --ink-3:#7A8791;
  --accent:#4FB3C4; --accent-ink:#0F1418; --accent-soft:#173A41;
  --good:#5CC48A; --good-soft:#173826; --warn:#E8A93A; --warn-soft:#3B2C0F; --crit:#F0655C; --crit-soft:#3F1B18;
  --tab-bg:rgba(23,30,37,.94); --bar-track:#2A343D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink)}

/* ---- shell ---- */
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--tab-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header.top .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header.top h1{font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
header.top .stamp{font-size:12px;color:var(--ink-3);white-space:nowrap}
header.top .stamp b{color:var(--ink-2);font-weight:500}
main{flex:1;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
section.screen{display:none}
section.screen.active{display:block}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tab-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 4px;border-radius:10px;color:var(--ink-3);font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent)}
nav.tabs button .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit);color:#fff;font-size:10.5px;line-height:16px;font-family:"Barlow",sans-serif;font-weight:600}

/* ---- shared pieces ---- */
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:18px 4px 8px}
.eyebrow:first-child{margin-top:4px}
.eyebrow .cnt{color:var(--ink-2);margin-left:6px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.list>li{border-top:1px solid var(--line-soft)}
.list>li:first-child{border-top:0}
.rowbtn{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:11px 14px;min-height:56px}
.rowbtn .t{font-weight:500;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.rowbtn .s{font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.rowbtn .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rowbtn .big{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;line-height:1}
.rowbtn .big small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px;font-family:"Barlow",sans-serif}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.detail{display:none;padding:0 14px 14px;background:var(--surface-2);border-top:1px dashed var(--line)}
li.open .detail{display:block}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-top:10px;font-size:13.5px}
.kv .k{color:var(--ink-2)}
.kv .v{text-align:right;font-weight:500}
.kv .h{grid-column:1/-1;font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.kv .note{grid-column:1/-1;font-size:12.5px;color:var(--ink-3)}
.bar{height:6px;border-radius:3px;background:var(--bar-track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2)}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-bottom:8px}
.search svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;padding:11px 0;font-size:16px;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search button{color:var(--ink-3);padding:6px;font-size:13px}
select.sel{width:100%;appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:8px}
.more{width:100%;padding:12px;text-align:center;color:var(--accent);font-weight:600;font-size:14px;border-top:1px solid var(--line-soft)}

/* ---- home ---- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:88px}
.tile .l{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;line-height:1.05;margin-top:2px}
.tile .d{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tile .d .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.tile .d .dot.crit{background:var(--crit)} .tile .d .dot.warn{background:var(--warn)} .tile .d .dot.good{background:var(--good)}
.note{font-size:13px;color:var(--ink-3);padding:6px 4px 0;line-height:1.4}
.stripe{border-left:3px solid transparent}
.stripe.crit{border-left-color:var(--crit)} .stripe.warn{border-left-color:var(--warn)}
.lotgrid{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13.5px;padding-top:8px}
.lotgrid .hd{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lotgrid .q{text-align:right;font-weight:500}
@media (prefers-reduced-motion:no-preference){ .detail{animation:fade .12s ease-out} }
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>

// ---- stamp: relative time of last pull ----
(function stamp(){
  const t = new Date(D.meta.pulledAt);
  const mins = Math.round((Date.now() - t) / 60000);
  let rel = mins < 2 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins/60)} h ago` : `${Math.round(mins/1440)} d ago`;
  const abs = t.toLocaleString('en-US', {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'});
  $('#stamp').textContent = rel; $('#stamp').title = 'Pulled ' + abs;
})();

// ---- derived ----
const P = D.products;
const cases = p => (p.perCase && p.perCase > 1) ? Math.floor(p.onHand / p.perCase) : null;
const coverClass = p => {
  if (p.vel <= 0) return '';
  if (p.onHand <= 0 || p.cover === 0) return 'crit';
  if (p.cover != null && p.cover <= 14) return 'crit';
  if (p.cover != null && p.cover <= 30) return 'warn';
  return 'good';
};
const coverText = p => {
  if (p.vel <= 0) return p.onHand > 0 ? 'no sales 90d' : '—';
  if (p.onHand <= 0) return 'OUT';
  if (p.cover == null) return '—';
  if (p.cover >= 999) return '365+ d';
  return `${p.cover} d`;
};
const isLow = p => p.vel > 0 && (p.onHand <= 0 || (p.cover != null && p.cover <= 30));
const isOut = p => p.vel > 0 && p.onHand <= 0;
const lowList = P.filter(isLow).sort((a,b) => (a.onHand<=0?-1:a.cover) - (b.onHand<=0?-1:b.cover) || b.vel - a.vel);
const outList = P.filter(isOut);
const inStock = P.filter(p => p.onHand > 0);
const locNames = [...new Set(P.flatMap(p => Object.keys(p.byLoc)))].sort((a,b) => P.filter(p=>p.byLoc[a]).length < P.filter(p=>p.byLoc[b]).length ? 1 : -1);
const cats = [...new Set(P.map(p => p.cat))].sort();

const S = D.sales.filter(o => !o.fba);
const FBA = D.sales.filter(o => o.fba);
const backorders = S.filter(o => o.eligible === 'Backordered');
const ready = S.filter(o => o.eligible === 'Eligible');
const packed = S.filter(o => /packed|shipped/i.test(o.eligible || '') || /Fully packed/.test(o.shipStatus||''));
const dueSoon = S.filter(o => o.ship && daysFrom(o.ship) >= -7);

const POs = D.pos.slice().sort((a,b) => (a.eta||'9999') < (b.eta||'9999') ? -1 : 1);
const latePOs = POs.filter(p => p.late > 0);
const doneOpenPOs = POs.filter(p => p.fullyReceived);
const T = D.transfers;
const tInbound = T.filter(t => t.dest === 'BBHQ' && !/received/i.test(t.shipStatus||''));
const tStale = T.filter(t => /received/i.test(t.shipStatus||''));
const tMoving = T.filter(t => !/received/i.test(t.shipStatus||'') && t.dest !== 'BBHQ');
const lotted = P.filter(p => p.lots.length);

// ---- Amazon FBA derived ----
// Finale tracks Amazon as its own set of locations per SKU (Fulfillable, FC Processing/Transfer,
// Inbound Receiving/Shipped, AWD Outbound, Unfulfillable, Researching). Bucket those into
// sellable-now / in-the-pipeline / stuck, per product.
function fbaBuckets(p){
  let full = 0, inb = 0, stuck = 0;
  for (const [loc, qty] of Object.entries(p.byLoc)){
    if (!loc.includes('Amazon')) continue;
    if (loc.includes('Unfulfillable') || loc.includes('Researching') || loc.includes('Problem')) stuck += qty;
    else if (loc.includes('Fulfillable')) full += qty;
    else inb += qty;
  }
  return { full, inb, stuck };
}
const fbaAll = P.filter(p => Object.keys(p.byLoc).some(l => l.includes('Amazon'))).map(p => Object.assign({}, p, { fbaB: fbaBuckets(p) }));
const fbaCover = p => p.vel > 0 ? Math.round(p.fbaB.full / p.vel) : null;
const fbaCoverClass = p => {
  if (p.vel <= 0) return '';
  if (p.fbaB.full <= 0) return p.fbaB.inb > 0 ? 'warn' : 'crit';
  const c = fbaCover(p);
  if (c <= 14) return 'crit';
  if (c <= 30) return 'warn';
  return 'good';
};
const fbaAtRisk = fbaAll.filter(p => p.vel > 0 && (p.fbaB.full <= 0 || fbaCover(p) <= 30)).sort((a,b) => {
  const av = a.fbaB.full <= 0 ? -1 : fbaCover(a), bv = b.fbaB.full <= 0 ? -1 : fbaCover(b);
  return av - bv || b.vel - a.vel;
});
const fbaUrgent = fbaAll.filter(p => p.vel > 0 && p.fbaB.full <= 0 && p.fbaB.inb <= 0);
const fbaStuckList = fbaAll.filter(p => p.fbaB.stuck > 0).sort((a,b) => b.fbaB.stuck - a.fbaB.stuck);
const fbaTotals = fbaAll.reduce((a,p) => ({ full: a.full+p.fbaB.full, inb: a.inb+p.fbaB.inb, stuck: a.stuck+p.fbaB.stuck }), {full:0, inb:0, stuck:0});

// badges
const badge = (id, n) => { const b = $('#'+id); if (n > 0) { b.textContent = n > 99 ? '99+' : n; b.hidden = false; } };
badge('b-stock', outList.length);
badge('b-inbound', latePOs.length);
badge('b-orders', backorders.length);
badge('b-fba', fbaUrgent.length);

function toggleRow(li){ li.classList.toggle('open'); li.querySelector('.rowbtn').setAttribute('aria-expanded', li.classList.contains('open')); }
function bindRows(root){ root.querySelectorAll('.rowbtn').forEach(b => b.addEventListener('click', () => toggleRow(b.closest('li')))); }

function productRow(p, ctx){

  kv.push(`<div class="h">On hand by location</div>`);
  if (!locs.length) kv.push(`<div class="note">Nothing on hand</div>`);
  locs.forEach(([l,q]) => kv.push(`<div class="k">${esc(l)}</div><div class="v num">${fmt(q)}</div>`));
  if (p.lots.length){ kv.push(`<div class="h">Lots</div>`); p.lots.forEach(l => kv.push(`<div class="k">${esc(l.lot)} <span style="color:var(--ink-3)">· ${esc(l.loc)}</span></div><div class="v num">${fmt(l.qty)}</div>`)); }
  kv.push(`<div class="h">Movement</div>`);
  kv.push(`<div class="k">Reserved on open orders</div><div class="v num">${fmt(p.reserved)}</div>`);
  kv.push(`<div class="k">On order (inbound)</div><div class="v num">${fmt(p.onOrder)}</div>`);
  p.onOrderRows.slice(0,4).forEach(r => kv.push(`<div class="note">↳ ${esc(r.note)}</div>`));
  kv.push(`<div class="k">Sold last 30 / 90 days</div><div class="v num">${fmt(p.s30)} / ${fmt(p.s90)}</div>`);
  kv.push(`<div class="k">Velocity</div><div class="v num">${p.vel ? p.vel.toFixed(2) + ' /day' : '—'}</div>`);
  if (p.perCase) kv.push(`<div class="k">Units per case</div><div class="v num">${fmt(p.perCase)}</div>`);
  if (p.supplier) kv.push(`<div class="k">Supplier</div><div class="v">${esc(p.supplier)}</div>`);
  if (p.upc) kv.push(`<div class="k">UPC</div><div class="v num">${esc(p.upc)}</div>`);
  kv.push(`<div class="k">Category</div><div class="v">${esc(p.cat)}</div>`);
  const sub = ctx === 'loc' ? '' : (locs.length > 1 ? `${locs.length} locations` : (locs[0] ? esc(locs[0][0]) : ''));
  return `<li class="stripe ${cc==='crit'||cc==='warn'?cc:''}"><button class="rowbtn" aria-expanded="false">
    <div><div class="t">${esc(p.desc || p.id)}</div><div class="s num">${esc(p.id)}${sub ? ' · ' + sub : ''}</div></div>
    <div class="r"><div class="big num">${fmt(p.onHand)}${c != null ? `<small>${fmt(c)} cs</small>` : ''}</div><span class="pill ${cc}">${coverText(p)}</span></div>
  </button><div class="detail"><div class="kv">${kv.join('')}</div></div></li>`;
}

function listWithMore(items, renderFn, pageSize=40, ctx){
  const id = 'l' + Math.random().toString(36).slice(2,8);
  let shown = Math.min(pageSize, items.length);
  const html = `<div class="panel"><ul class="list" id="${id}">${items.slice(0, shown).map(x => renderFn(x, ctx)).join('')}</ul>${items.length > shown ? `<button class="more" data-for="${id}">Show ${Math.min(pageSize, items.length - shown)} more of ${items.length}</button>` : ''}${items.length ? '' : '<div class="empty">Nothing here right now</div>'}</div>`;
  setTimeout(() => {
    const ul = document.getElementById(id); if (!ul) return;
    bindRows(ul);
    const more = ul.parentElement.querySelector('.more');
    if (more) more.addEventListener('click', () => {
      const next = items.slice(shown, shown + pageSize); shown += next.length;
      const frag = document.createElement('div'); frag.innerHTML = next.map(x => renderFn(x, ctx)).join('');
      [...frag.children].forEach(li => ul.appendChild(li)); bindRows(ul);
      if (shown >= items.length) more.remove(); else more.textContent = `Show ${Math.min(pageSize, items.length - shown)} more of ${items.length}`;
    });
  }, 0);
  return html;
}

// ---- STOCK ----
let stockState = { q:'', chip:'all', cat:'', loc:'' };
function renderStock(){
  const el = $('#s-stock');
  el.innerHTML = `
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="SKU, description or UPC" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(stockState.q)}"><button id="qx" ${stockState.q?'':'hidden'}>Clear</button></div>
  <div class="chips" id="stockChips">
    <button class="chip" data-chip="all">All in stock<span class="n">${inStock.length}</span></button>
    <button class="chip" data-chip="low">Low cover<span class="n">${lowList.length}</span></button>
    <button class="chip" data-chip="out">Out<span class="n">${outList.length}</span></button>
    <button class="chip" data-chip="inbound">Inbound<span class="n">${P.filter(p=>p.onOrder>0).length}</span></button>
    <button class="chip" data-chip="reserved">Reserved<span class="n">${P.filter(p=>p.reserved>0).length}</span></button>
    <button class="chip" data-chip="every">Every SKU<span class="n">${P.length}</span></button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <select class="sel" id="loc"><option value="">Any location</option>${locNames.map(l => `<option value="${esc(l)}" ${stockState.loc===l?'selected':''}>${esc(l)}</option>`).join('')}</select>
    <select class="sel" id="cat"><option value="">Any category</option>${cats.map(c => `<option value="${esc(c)}" ${stockState.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>
  <div id="stockList"></div>`;
  const q = $('#q', el), qx = $('#qx', el);
  q.addEventListener('input', () => { stockState.q = q.value; qx.hidden = !q.value; drawStock(); });
  qx.addEventListener('click', () => { q.value=''; stockState.q=''; qx.hidden=true; drawStock(); q.focus(); });
  $('#loc', el).addEventListener('change', e => { stockState.loc = e.target.value; drawStock(); });
  $('#cat', el).addEventListener('change', e => { stockState.cat = e.target.value; drawStock(); });
  el.querySelectorAll('#stockChips .chip').forEach(c => c.addEventListener('click', () => { stockState.chip = c.dataset.chip; drawStock(); }));
  drawStock();
}
function drawStock(){
  const el = $('#s-stock');
  el.querySelectorAll('#stockChips .chip').forEach(c => c.classList.toggle('active', c.dataset.chip === stockState.chip));
  let items;
  switch (stockState.chip){
    case 'low': items = lowList; break;
    case 'out': items = outList.slice().sort((a,b)=>b.vel-a.vel); break;
    case 'inbound': items = P.filter(p=>p.onOrder>0).sort((a,b)=>b.onOrder-a.onOrder); break;
    case 'reserved': items = P.filter(p=>p.reserved>0).sort((a,b)=>b.reserved-a.reserved); break;
    case 'every': items = P.slice().sort((a,b)=>(a.desc||'').localeCompare(b.desc||'')); break;
    default: items = inStock.slice().sort((a,b)=>(a.desc||'').localeCompare(b.desc||''));
  }
  if (stockState.loc) items = items.filter(p => p.byLoc[stockState.loc] > 0).map(p => Object.assign({}, p, {onHand: p.byLoc[stockState.loc]}));
  if (stockState.cat) items = items.filter(p => p.cat === stockState.cat);
  const q = stockState.q.trim().toLowerCase();
  if (q){
    const terms = q.split(/\s+/);
    items = (stockState.chip === 'all' && !stockState.loc ? P : items).filter(p => { const hay = `${p.id} ${p.desc||''} ${p.upc||''} ${p.cat}`.toLowerCase(); return terms.every(t => hay.includes(t)); });
  }
  const head = `<div class="eyebrow">${stockState.loc ? esc(stockState.loc) + ' · ' : ''}${q ? 'Search results' : ({all:'In stock',low:'Low cover — sells, ≤30 days left',out:'Out of stock — still selling',inbound:'On order',reserved:'Reserved on open orders',every:'All active SKUs'})[stockState.chip]}<span class="cnt num">${items.length}</span></div>`;
  $('#stockList', el).innerHTML = head + listWithMore(items, productRow, 40, stockState.loc ? 'loc' : '');
}

// ---- INBOUND ----
function renderInbound(){
  const el = $('#s-inbound');
  const late = POs.filter(p=>p.late>0), onTime = POs.filter(p=>!p.late && !p.fullyReceived);
  el.innerHTML = `
  ${late.length ? `<div class="eyebrow">Past expected date<span class="cnt num">${late.length}</span></div>${listWithMore(late, poRow)}` : ''}
  <div class="eyebrow">Purchase orders on the way<span class="cnt num">${onTime.length}</span></div>${listWithMore(onTime, poRow)}
  ${doneOpenPOs.length ? `<div class="eyebrow">Received, still open<span class="cnt num">${doneOpenPOs.length}</span></div>${listWithMore(doneOpenPOs, poRow)}<p class="note">Stock is in. These just need to be marked complete in Finale.</p>` : ''}
  ${tInbound.length ? `<div class="eyebrow">Transfers inbound to HQ<span class="cnt num">${tInbound.length}</span></div>${listWithMore(tInbound, transferRow)}` : ''}
  ${tMoving.length ? `<div class="eyebrow">Transfers outbound<span class="cnt num">${tMoving.length}</span></div>${listWithMore(tMoving, transferRow)}` : ''}
  ${tStale.length ? `<div class="eyebrow">Transfers received, still open<span class="cnt num">${tStale.length}</span></div>${listWithMore(tStale, transferRow, 20)}` : ''}`;
}

// ---- ORDERS ----
let orderChip = 'all';
function renderOrders(){
  const el = $('#s-orders');
  const sources = [...new Set(S.map(o => o.source || 'Unknown'))];
  const byOrigin = [...new Set(S.map(o => o.origin || '?'))];
  el.innerHTML = `
  <div class="chips" id="orderChips">
    <button class="chip" data-chip="all">All<span class="n">${S.length}</span></button>
    <button class="chip" data-chip="back">Backordered<span class="n">${backorders.length}</span></button>
    <button class="chip" data-chip="ready">Ready to pick<span class="n">${ready.length}</span></button>
    <button class="chip" data-chip="packed">Packed<span class="n">${packed.length}</span></button>
    <button class="chip" data-chip="week">Ships this week<span class="n">${S.filter(o=>o.ship && daysFrom(o.ship) >= -7 && daysFrom(o.ship) <= 0).length}</span></button>
    ${byOrigin.filter(x=>x!=='BBHQ').map(o => `<button class="chip" data-chip="o:${esc(o)}">${esc(o)}<span class="n">${S.filter(x=>x.origin===o).length}</span></button>`).join('')}
  </div>
  <select class="sel" id="src"><option value="">Every channel</option>${sources.map(s => `<option value="${esc(s)}">${esc(s)} (${S.filter(o=>(o.source||'Unknown')===s).length})</option>`).join('')}</select>
  <div id="orderList"></div>`;
  el.querySelectorAll('#orderChips .chip').forEach(c => c.addEventListener('click', () => { orderChip = c.dataset.chip; drawOrders(); }));
  $('#src', el).addEventListener('change', drawOrders);
  drawOrders();
}
function drawOrders(){
  const el = $('#s-orders');
  el.querySelectorAll('#orderChips .chip').forEach(c => c.classList.toggle('active', c.dataset.chip === orderChip));
  let items = S;
  if (orderChip === 'back') items = backorders;
  else if (orderChip === 'ready') items = ready;
  else if (orderChip === 'packed') items = packed;
  else if (orderChip === 'week') items = S.filter(o=>o.ship && daysFrom(o.ship) >= -7 && daysFrom(o.ship) <= 0);
  else if (orderChip.startsWith('o:')) items = S.filter(o => o.origin === orderChip.slice(2));
  const src = $('#src', el).value; if (src) items = items.filter(o => (o.source||'Unknown') === src);
  items = items.slice().sort((a,b) => (a.ship||'9999') < (b.ship||'9999') ? -1 : (a.ship||'9999') > (b.ship||'9999') ? 1 : a.date < b.date ? -1 : 1);
  const units = items.reduce((a,o)=>a+o.units,0);
  $('#orderList', el).innerHTML = `<div class="eyebrow">Sorted by ship date<span class="cnt num">${items.length} orders · ${fmt(units)} units</span></div>` + listWithMore(items, orderRow) +
    `<p class="note">${FBA.length} Amazon FBA orders are open but fulfilled by Amazon, so they're left out here. "Ready to pick" is Finale's eligible-to-ship flag; backordered means at least one line can't be filled from current stock.</p>`;
}

// ---- LOTS ----
function renderLots(){
  const el = $('#s-lots');
  const rows = lotted.slice().sort((a,b)=>(a.desc||'').localeCompare(b.desc||''));
  const lotRow = p => {
    const total = p.lots.reduce((a,l)=>a+l.qty,0);
    const unlotted = p.onHand - total;
    return `<li><button class="rowbtn" aria-expanded="false"><div><div class="t">${esc(p.desc||p.id)}</div><div class="s num">${esc(p.id)} · ${p.lots.length} lot${p.lots.length>1?'s':''}${unlotted>0?` · ${fmt(unlotted)} units without a lot`:''}</div></div><div class="r"><div class="big num">${fmt(p.onHand)}</div><span class="pill ${unlotted>0?'warn':'good'}">${unlotted>0?'partly lotted':'fully lotted'}</span></div></button>
    <div class="detail"><div class="lotgrid"><div class="hd">Lot</div><div class="hd">Location</div><div class="hd q">Units</div>${p.lots.map(l=>`<div class="num">${esc(l.lot)}</div><div style="color:var(--ink-2)">${esc(l.loc)}</div><div class="q num">${fmt(l.qty)}</div>`).join('')}</div></div></li>`;
  };
  el.innerHTML = `
  <div class="tiles" style="grid-template-columns:1fr 1fr">
    <div class="tile"><span class="l">SKUs carrying lots</span><span class="v num">${lotted.length}</span><span class="d">of ${inStock.length} in stock</span></div>
    <div class="tile"><span class="l">Units under a lot</span><span class="v num">${fmt(lotted.reduce((a,p)=>a+p.lots.reduce((x,l)=>x+l.qty,0),0))}</span><span class="d">of ${fmt(inStock.reduce((a,p)=>a+p.onHand,0))} on hand</span></div>
  </div>
  <div class="eyebrow">Lotted stock<span class="cnt num">${rows.length}</span></div>
  ${listWithMore(rows, lotRow)}
  <p class="note">Finale has lot tracking on, but only these SKUs have lot IDs recorded, and the IDs don't carry a best-by date. Expiry can't be tracked from Finale until lots are entered at receiving with a date in the lot ID or a custom field.</p>`;
}

// ---- FBA ----
function fbaRow(p){
  const cc = fbaCoverClass(p);
  const cover = fbaCover(p);
  const coverTxt = p.vel <= 0 ? '—' : p.fbaB.full <= 0 ? (p.fbaB.inb > 0 ? 'out · inbound' : 'OUT') : cover >= 999 ? '365+ d' : `${fmt(cover)} d`;
  const warehouse = Math.max(0, p.onHand - p.fbaB.full - p.fbaB.inb - p.fbaB.stuck);
  const target = p.vel > 0 ? Math.round(p.vel * 45) : 0;
  const need = Math.max(0, target - p.fbaB.full - p.fbaB.inb);
  const ship = Math.min(need, warehouse);
  const kv = [];
  kv.push(`<div class="k">Fulfillable at Amazon</div><div class="v num">${fmt(p.fbaB.full)}</div>`);
  kv.push(`<div class="k">Inbound to Amazon</div><div class="v num">${fmt(p.fbaB.inb)}</div>`);
  if (p.fbaB.stuck) kv.push(`<div class="k">Stuck (unfulfillable / researching)</div><div class="v num">${fmt(p.fbaB.stuck)}</div>`);
  kv.push(`<div class="k">Available at HQ / other locations</div><div class="v num">${fmt(warehouse)}</div>`);
  kv.push(`<div class="k">Velocity (all channels)</div><div class="v num">${p.vel ? p.vel.toFixed(2) + ' /day' : '—'}</div>`);
  if (need > 0) kv.push(`<div class="note">To reach ~45 days of Amazon cover: ship ${fmt(ship)}${ship < need ? ` (would need ${fmt(need)}; only ${fmt(warehouse)} on hand elsewhere)` : ''}.</div>`);
  return `<li class="stripe ${cc==='crit'||cc==='warn'?cc:''}"><button class="rowbtn" aria-expanded="false">
    <div><div class="t">${esc(p.desc || p.id)}</div><div class="s num">${esc(p.id)} · ${fmt(p.fbaB.inb)} inbound</div></div>
    <div class="r"><div class="big num">${fmt(p.fbaB.full)}<small>fulfillable</small></div><span class="pill ${cc}">${coverTxt}</span></div>
  </button><div class="detail"><div class="kv">${kv.join('')}</div></div></li>`;
}
function renderFBA(){
  const el = $('#s-fba');
  el.innerHTML = `
  <div class="tiles" style="grid-template-columns:1fr 1fr">
    <div class="tile"><span class="l">Fulfillable at Amazon</span><span class="v num">${fmt(fbaTotals.full)}</span><span class="d">across ${fmt(fbaAll.length)} SKUs on Amazon</span></div>
    <div class="tile"><span class="l">Inbound to Amazon</span><span class="v num">${fmt(fbaTotals.inb)}</span><span class="d">already moving</span></div>
  </div>
  <div class="eyebrow">Needs restock at Amazon<span class="cnt num">${fbaAtRisk.length}</span></div>
  ${listWithMore(fbaAtRisk, fbaRow, 40)}
  ${fbaTotals.stuck ? `<div class="eyebrow">Stuck inventory<span class="cnt num">${fmt(fbaTotals.stuck)} units</span></div>${listWithMore(fbaStuckList, fbaRow, 20)}<p class="note">Sitting in Unfulfillable / Researching / Problem at Amazon — tied up and not sellable until it's worked in Seller Central.</p>` : ''}
  <p class="note">Fulfillable = sellable right now at Amazon; cover uses the same blended, all-channel sales velocity as the rest of this dashboard (Finale doesn't split velocity by channel), so treat it as a first pass, not an exact Amazon-only rate. The restock suggestion targets ~45 days of Amazon cover and is capped by what's actually on hand outside Amazon.</p>`;
}

// ---- nav ----
const rendered = {};
const renderers = { home: renderHome, stock: renderStock, inbound: renderInbound, orders: renderOrders, lots: renderLots, fba: renderFBA };
function go(tab, chip){
  document.querySelectorAll('section.screen').forEach(s => s.classList.toggle('active', s.id === 's-' + tab));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (chip && tab === 'stock') stockState.chip = chip;
  if (chip && tab === 'orders') orderChip = chip;
  if (!rendered[tab]) { renderers[tab](); rendered[tab] = true; }
  else if (chip && tab === 'stock') drawStock();
  else if (chip && tab === 'orders') drawOrders();
  window.scrollTo(0, 0);
  try { localStorage.setItem('bb-tab', tab); } catch(e){}
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
let start = 'home';
try { const s = localStorage.getItem('bb-tab'); if (s && renderers[s]) start = s; } catch(e){}
go(start);
})();
</script>
</body>
</html>
